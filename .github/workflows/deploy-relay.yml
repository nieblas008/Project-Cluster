name: Deploy relay

# Manual: Actions → Deploy relay → Run workflow.
# Needs repo secrets RELAY_SSH_HOST and RELAY_SSH_KEY (private key for root,
# created during provisioning — see docs/runbooks/relay.md).
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Pull and rebuild on the VPS
        env:
          RELAY_SSH_HOST: ${{ secrets.RELAY_SSH_HOST }}
          RELAY_SSH_KEY: ${{ secrets.RELAY_SSH_KEY }}
        run: |
          install -m 600 /dev/null ssh_key
          printf '%s\n' "$RELAY_SSH_KEY" > ssh_key
          ssh -i ssh_key -o StrictHostKeyChecking=accept-new "root@${RELAY_SSH_HOST}" \
            'cd /opt/cluster/repo && git pull --ff-only && docker compose -f deploy/compose.yml up -d --build && docker image prune -f'
