# Runs on the relay VPS (provisioned by provision-relay.sh).
# From /opt/cluster/repo:  docker compose -f deploy/compose.yml up -d --build
services:
  relay:
    build:
      context: ..
      dockerfile: Relay/Dockerfile
    container_name: cluster-relayd
    restart: unless-stopped
    ports:
      - "7600:7600/tcp"
      - "7601:7601/udp"
    volumes:
      - /opt/cluster/tls:/tls:ro
    command: ["--tls-cert", "/tls/cert.pem", "--tls-key", "/tls/key.pem"]
